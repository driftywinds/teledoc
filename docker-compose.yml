services:
  teledoc:
    image: ghcr.io/driftywinds/teledoc:latest
    restart: unless-stopped
    ports:
      - "9879:9879"
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Temp downloads live here (configurable via TEMP_DIR); the container
      # only ever creates/deletes teledoc- prefixed files inside it.
      - ./temp:/data/temp